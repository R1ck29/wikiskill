name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (ruff, settings in ruff.toml)
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        run: pipx run ruff==0.17.1 check .
      - name: Unit tests (standard library only, no network)
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test (no model; python stands in for the CLI)
        run: |
          python -m wikiskill --version
          echo '{"claude": {"command": "python"}}' > ci-backend.json
          python -m wikiskill check --suite examples/sales-analysis --no-call --backend-config ci-backend.json
          python -m wikiskill check --suite examples/translation-ja-en --no-call --backend-config ci-backend.json
        shell: bash
      - name: Example answers re-verified with SQLite
        run: python examples/sales-analysis/make_tasks.py --verify
